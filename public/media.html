    <a href="/media.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Media</a>

    <a href="/notify.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Alerts</a>
  </nav>
</aside>

<main>
  <h1 class="page-title">Media</h1>
  <div class="biz-row">
    <label class="sr-only" for="businessId">Business ID</label>
    <input id="businessId" placeholder="Business ID" autocomplete="off">
    <button class="secondary" onclick="refreshStatus()">Load</button>
  </div>

  <div class="scroll-area">
    <section class="card">
      <label class="file-btn" for="mediaFile">Choose a photo, video or voice note</label>
      <input type="file" id="mediaFile" class="file-input-hidden" accept="image/*,video/*,audio/*">
      <label for="mediaCaption">Caption</label>
      <input id="mediaCaption">
      <label for="mediaUseFor">When to send</label>
      <input id="mediaUseFor">
      <label for="mediaOwnerNote">What is this file for?</label>
      <input id="mediaOwnerNote">
      <label for="mediaPurpose">Ye file kis liye hai?</label>
      <select id="mediaPurpose">
        <option value="knowledge" selected>Brain knowledge — sirf brain seekhega, customer ko kabhi nahi bhejega</option>
        <option value="customer">Customer file — zaroorat par customer ko bhejega</option>
      </select>
    </section>

    <section class="card list-card">
      <h2>Uploaded media</h2>
      <div class="seg-tabs" role="group" aria-label="Filter by kind">
        <button type="button" class="active" id="mediaFilterAll" onclick="setMediaFilter('all')">All</button>
        <button type="button" id="mediaFilterImage" onclick="setMediaFilter('image')">Photo</button>
        <button type="button" id="mediaFilterVideo" onclick="setMediaFilter('video')">Video</button>
        <button type="button" id="mediaFilterAudio" onclick="setMediaFilter('audio')">Voice</button>
      </div>
      <div id="mediaList" class="list-scroll"><p class="muted empty-note">No media yet.</p></div>
    </section>
  </div>

  <!-- Fixed action bar: Upload is always on screen. -->
  <div class="action-bar"><button onclick="uploadMedia()">Upload media</button></div>

  <nav class="bottom-nav" aria-label="Pages">
    <a href="/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="/connect.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Connect</a>
    <a href="/brain.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Brain</a>
    <button type="button" onclick="toggleDrawer()" aria-label="More pages"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>More</button>
  </nav>
</main>

<div id="toast"></div>
<script src="/app.js?v=20261123"></script>
</body>
</html>
