<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b37">
<title>Musa WhatsApp Bot Platform — Admin Panel</title>
<link rel="stylesheet" href="/style.css?v=20261123">
<style>
/* Admin Panel page only: rows inside the section cards. Same white +
   dark-blue 3D language as the Live Activity page — no other colors. */
.live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--green-dark); }
.live-dot i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; box-shadow: 0 0 0 2px var(--green-tint); }
.act-row { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--border); border-radius: 16px; padding: 13px 14px; margin: 0 0 10px; background: #ffffff; }
.act-row:last-child { margin-bottom: 0; }
.act-icon { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--navy-tint); color: var(--navy); display: flex; align-items: center; justify-content: center; }
.act-icon svg { width: 22px; height: 22px; display: block; }
.act-body { flex: 1; min-width: 0; }
.act-body b { display: block; font-size: 15px; line-height: 1.35; word-break: break-word; }
.act-body .act-sub { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-top: 2px; word-break: break-word; }
.act-row .badge { flex: none; align-self: center; }
.act-row button.small { flex: none; align-self: center; }
.section-icon { width: 24px; height: 24px; color: var(--navy); flex: none; }
.section-icon svg { width: 24px; height: 24px; display: block; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.card-head h2 { margin: 0; flex: 1; }
.private-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 800; background: var(--navy-tint); color: var(--navy-deep); white-space: nowrap; }
.private-badge svg { width: 13px; height: 13px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-name">Musa <em>WhatsApp Bot</em></div>
    <span class="private-badge" style="margin-left:auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Private</span>
  </div>
</header>

<main>
  <h1 class="page-title">Admin Panel</h1>

  <div class="scroll-area" id="scrollArea">
    <section class="card" id="overviewCard">
      <div class="card-head">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        <h2>Overview</h2>
        <span class="private-badge" id="bizCount"></span>
      </div>
      <p class="muted" id="overviewLine" style="margin:0">Checking…</p>
      <p style="margin:10px 0 0"><span class="live-dot"><i></i>Live — updates every 10 seconds</span> <span class="muted" id="updatedAt"></span></p>
      <button class="secondary small" type="button" onclick="loadOverview()">Refresh now</button>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <h2>Total users</h2>
        <span class="private-badge" id="totalUsersCount"></span>
      </div>
      <div id="businessList"><p class="empty-note">No users yet.</p></div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
        <h2>Number pool</h2>
        <span class="private-badge" id="poolCount"></span>
      </div>
      <label for="poolNumbers">Add numbers to the pool</label>
      <textarea id="poolNumbers" rows="4" placeholder="One number per line (or comma separated)"></textarea>
      <button type="button" onclick="addPoolNumbers()">Add numbers</button>
      <p class="muted" id="poolAddNote" style="margin:10px 0 0"></p>
      <hr>
      <div id="poolList"><p class="empty-note">Pool is empty — upload numbers below.</p></div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span>
        <h2>Bulk campaigns</h2>
        <span class="private-badge" id="bulkCount"></span>
      </div>
      <div id="bulkList"><p class="empty-note">No businesses yet.</p></div>
    </section>
  </div>
</main>

<div id="toast"></div>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';
  var timer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) { alert(msg); return; }
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 3200);
  }
  // A count from the server: a plain number, or an array of items.
  function asCount(v) {
    if (typeof v === 'number') return v;
    if (Array.isArray(v)) return v.length;
    return null;
  }
  function countTokens(value) {
    return value.split(/[\n,]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; }).length;
  }

  function showPrivate() {
    if (timer) { clearInterval(timer); timer = null; }
    document.getElementById('scrollArea').innerHTML =
      '<section class="card"><h2>This page is private</h2>' +
      '<p class="muted">This admin page is only for the owner. If you are the owner, open it with the private link that was shared with you.</p></section>';
  }

  function linkBadge(b) {
    if (b.linked) return '<span class="badge linked">Linked</span>';
    return '<span class="badge not-linked">Not linked</span>';
  }

  function render(data) {
    var businesses = data.businesses || [];
    var pool = data.pool || [];
    var totalUsers = 0, totalIn = 0, totalOut = 0;
    businesses.forEach(function (b) {
      var t = b.totals || {};
      totalUsers += t.users || 0;
      totalIn += t.incoming || 0;
      totalOut += t.replies || 0;
    });
    var available = pool.filter(function (p) { return p.status !== 'claimed'; }).length;

    document.getElementById('bizCount').textContent = businesses.length + (businesses.length === 1 ? ' business' : ' businesses');
    document.getElementById('overviewLine').textContent =
      businesses.length + (businesses.length === 1 ? ' business' : ' businesses') +
      ' · ' + totalUsers + (totalUsers === 1 ? ' user' : ' users') +
      ' · ' + pool.length + (pool.length === 1 ? ' number' : ' numbers') + ' in the pool (' + available + ' available)';
    document.getElementById('updatedAt').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

    // (1) Total users — one row per business.
    document.getElementById('totalUsersCount').textContent = String(totalUsers);
    document.getElementById('businessList').innerHTML = businesses.length ? businesses.map(function (b) {
      var t = b.totals || {};
      var meta = esc(b.id || '');
      if (b.businessType) meta += ' · ' + esc(b.businessType);
      if (b.whatsappStatus) meta += ' · ' + esc(b.whatsappStatus);
      var phoneLine = 'Phone: ' + (b.phone || '—');
      if (b.claimedPhone) phoneLine += ' · Claimed: ' + b.claimedPhone;
      return '<div class="act-row"><span class="act-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>' +
        '<div class="act-body"><b>' + esc(b.name || b.id || '') + '</b>' +
        '<span class="act-sub">' + meta + '</span>' +
        '<span class="act-sub">' + esc(phoneLine) + '</span>' +
        '<span class="act-sub">' + esc(t.users || 0) + ' users · ' + esc(t.incoming || 0) + ' messages in · ' + esc(t.replies || 0) + ' replies out</span></div>' +
        linkBadge(b) + '</div>';
    }).join('') : '<p class="empty-note">No users yet.</p>';

    // (2) Number pool — one row per number.
    document.getElementById('poolCount').textContent = available + ' available';
    document.getElementById('poolList').innerHTML = pool.length ? pool.map(function (p) {
      var claimed = p.status === 'claimed';
      var pill = claimed ? '<span class="badge waiting">Claimed</span>' : '<span class="badge linked">Available</span>';
      var sub = claimed
        ? 'Claimed by ' + (p.claimedBy || '—') + (p.claimedAt ? ' · ' + fmtTime(p.claimedAt) : '')
        : 'Available to claim';
      return '<div class="act-row"><span class="act-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>' +
        '<div class="act-body"><b>' + esc(p.phone || '') + '</b>' +
        '<span class="act-sub">' + esc(sub) + '</span></div>' +
        pill +
        (claimed ? ' <button class="small danger" type="button" onclick="releasePoolNumber(\'' + esc(p.phone) + '\')">Release</button>' : '') + '</div>';
    }).join('') : '<p class="empty-note">Pool is empty — upload numbers below.</p>';

    // (3) Bulk campaigns — one row per business, reusing the bulk page.
    document.getElementById('bulkCount').textContent = String(businesses.length);
    document.getElementById('bulkList').innerHTML = businesses.length ? businesses.map(function (b) {
      return '<div class="act-row"><span class="act-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span>' +
        '<div class="act-body"><b>' + esc(b.name || b.id || '') + '</b>' +
        '<span class="act-sub">' + esc(b.id || '') + '</span></div>' +
        '<button class="small" type="button" onclick="openBulk(\'' + esc(b.id) + '\')">Open bulk</button></div>';
    }).join('') : '<p class="empty-note">No businesses yet.</p>';
  }

  window.loadOverview = async function () {
    if (!token) { showPrivate(); return; }
    try {
      var res = await fetch('/api/admin/overview?t=' + encodeURIComponent(token));
      if (!res.ok) { showPrivate(); return; }
      render(await res.json());
    } catch (e) {
      document.getElementById('overviewLine').textContent = 'Could not load the admin overview — will try again in 10 seconds.';
    }
  };

  window.addPoolNumbers = async function () {
    if (!token) { showPrivate(); return; }
    var ta = document.getElementById('poolNumbers');
    var value = ta.value;
    if (!value.trim()) { toast('Enter at least one number first.'); return; }
    try {
      var res = await fetch('/api/admin/pool?t=' + encodeURIComponent(token), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numbers: value })
      });
      var d = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(d.error || ('Request failed: ' + res.status));
      var added = asCount(d.added != null ? d.added : (d.addedCount != null ? d.addedCount : d.count));
      if (added == null) added = countTokens(value);
      var skipped = asCount(d.skipped != null ? d.skipped : d.skippedCount) || 0;
      var invalid = asCount(d.invalid != null ? d.invalid : d.invalidCount) || 0;
      var msg = 'Added ' + added + (added === 1 ? ' number' : ' numbers');
      if (skipped) msg += ' · ' + skipped + ' skipped';
      if (invalid) msg += ' · ' + invalid + ' invalid';
      toast(msg + '.');
      var note = document.getElementById('poolAddNote');
      if (note) note.textContent = (skipped || invalid) ? (skipped + ' skipped, ' + invalid + ' invalid.') : '';
      if (added > 0) ta.value = '';
      loadOverview();
    } catch (e) {
      toast('Error: ' + e.message);
    }
  };

  window.releasePoolNumber = async function (phone) {
    if (!token) { showPrivate(); return; }
    if (!confirm('Release this number back to the pool?')) return;
    try {
      var res = await fetch('/api/admin/pool/release?t=' + encodeURIComponent(token), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone })
      });
      var d = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(d.error || ('Request failed: ' + res.status));
      toast('Number released back to the pool.');
      loadOverview();
    } catch (e) {
      toast('Error: ' + e.message);
    }
  };

  // Bulk sending itself lives on the existing bulk page — this just
  // selects the business there and opens it.
  window.openBulk = function (id) {
    localStorage.setItem('musa-business-id', id);
    location.href = '/bulk.html';
  };

  loadOverview();
  timer = setInterval(loadOverview, 10000);
})();
</script>
</body>
</html>
