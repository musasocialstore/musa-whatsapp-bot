<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b37">
<title>Musa WhatsApp Bot Platform — Live Activity</title>
<link rel="stylesheet" href="/style.css?v=20261123">
<style>
/* Live Activity page only: rows inside the section cards. Same white +
   dark-blue 3D language as the rest of the board — no other colors. */
.live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--green-dark); }
.live-dot i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; box-shadow: 0 0 0 2px var(--green-tint); }
.act-row { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--border); border-radius: 16px; padding: 13px 14px; margin: 0 0 10px; background: #ffffff; }
.act-row:last-child { margin-bottom: 0; }
.act-icon { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--navy-tint); color: var(--navy); display: flex; align-items: center; justify-content: center; }
.act-icon svg { width: 22px; height: 22px; display: block; }
.act-icon.warn { background: var(--amber-bg); color: var(--amber); }
.act-icon.bad { background: var(--red-tint); color: var(--red); }
.act-body { flex: 1; min-width: 0; }
.act-body b { display: block; font-size: 15px; line-height: 1.35; word-break: break-word; }
.act-body .act-sub { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-top: 2px; word-break: break-word; }
.act-body .act-text { display: block; font-size: 14.5px; line-height: 1.55; margin-top: 4px; word-break: break-word; }
.act-time { flex: none; color: var(--muted-2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.act-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.act-head h2 { margin: 0; }
.section-icon { width: 24px; height: 24px; color: var(--navy); flex: none; }
.section-icon svg { width: 24px; height: 24px; display: block; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.card-head h2 { margin: 0; flex: 1; }
.private-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 800; background: var(--navy-tint); color: var(--navy-deep); white-space: nowrap; }
.private-badge svg { width: 13px; height: 13px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-name">Musa <em>WhatsApp Bot</em></div>
    <span class="private-badge" style="margin-left:auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Private</span>
  </div>
</header>

<main>
  <h1 class="page-title">Live Activity</h1>

  <div class="scroll-area" id="scrollArea">
    <section class="card" id="statusCard">
      <div class="card-head">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></span>
        <h2>Link status</h2>
        <span class="badge not-linked" id="linkBadge">Not linked</span>
      </div>
      <p class="muted" id="linkLine" style="margin:0">Checking…</p>
      <p style="margin:10px 0 0"><span class="live-dot"><i></i>Live — updates every 10 seconds</span> <span class="muted" id="updatedAt"></span></p>
      <button class="secondary small" type="button" onclick="loadActivity()">Refresh now</button>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <h2>Users</h2>
      </div>
      <div id="usersList"><p class="empty-note">No users yet.</p></div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        <h2>Messages received</h2>
      </div>
      <div id="incomingList"><p class="empty-note">No messages yet.</p></div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg></span>
        <h2>Replies sent</h2>
      </div>
      <div id="repliesList"><p class="empty-note">No replies yet.</p></div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
        <h2>Events</h2>
      </div>
      <div id="eventsList"><p class="empty-note">No events yet.</p></div>
    </section>
  </div>
</main>

<div id="toast"></div>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var businessId = params.get('businessId') || 'musa-social-store';
  var token = params.get('t') || '';
  var timer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }
  function senderLabel(e) {
    if (e.name) return e.name;
    if (e.phone) return e.phone;
    return e.from || '';
  }
  function kindLabel(kind) {
    return kind === 'photo' ? 'Photo' : kind === 'video' ? 'Video' : kind === 'voice' ? 'Voice note' : 'Message';
  }
  function deliveryBadge(delivery) {
    if (delivery === 'delivered') return '<span class="badge linked">Delivered</span>';
    if (delivery === 'read') return '<span class="badge confirmed">Read</span>';
    if (delivery === 'failed') return '<span class="badge not-linked">Failed</span>';
    return '<span class="badge waiting">Sent</span>';
  }
  function iconFor(type) {
    if (type === 'connect') return '<span class="act-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></span>';
    if (type === 'disconnect') return '<span class="act-icon bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></span>';
    if (type === 'badmac') return '<span class="act-icon warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>';
    return '<span class="act-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><polyline points="21 3 21 9 15 9"/></svg></span>';
  }
  function eventText(e) {
    if (e.type === 'connect') return 'WhatsApp connected';
    if (e.type === 'disconnect') {
      var s = 'WhatsApp disconnected';
      if (e.code !== undefined && e.code !== null) s += ' (code ' + esc(e.code) + ')';
      if (e.detail) s += ' — ' + esc(e.detail);
      return s;
    }
    if (e.type === 'badmac') {
      var b = 'Message could not be read (Bad MAC)' + (e.user ? ' — sender ' + esc(e.user) : '');
      if (e.count && e.count > 1) b += ' × ' + esc(e.count);
      return b;
    }
    if (e.type === 'session-reset') return 'Broken session reset' + (e.user ? ' for ' + esc(e.user) : '') + ' — sender will re-key on next retry';
    return esc(e.type);
  }

  function showPrivate() {
    if (timer) { clearInterval(timer); timer = null; }
    document.getElementById('scrollArea').innerHTML =
      '<section class="card"><h2>This page is private</h2>' +
      '<p class="muted">This live-activity page is only for the owner. If you are the owner, open it with the private link that was shared with you.</p></section>';
  }

  function render(data) {
    var badge = document.getElementById('linkBadge');
    var line = document.getElementById('linkLine');
    if (data.linked) {
      badge.className = 'badge linked';
      badge.textContent = 'Linked';
      line.textContent = 'WhatsApp is linked on ' + (data.phone || '—') +
        (data.linkedAt ? ' since ' + fmtTime(data.linkedAt) : '') + '.';
    } else {
      badge.className = 'badge not-linked';
      badge.textContent = 'Not linked';
      line.textContent = 'WhatsApp is not linked' + (data.phone ? ' (last number: ' + data.phone + ')' : '') + '.';
    }
    document.getElementById('updatedAt').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

    var users = data.users || [];
    document.getElementById('usersList').innerHTML = users.length ? users.map(function (u) {
      return '<div class="act-row"><span class="act-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>' +
        '<div class="act-body"><b>' + esc(u.name || u.phone || u.from) + '</b>' +
        '<span class="act-sub">' + esc(u.phone ? u.phone : u.from) + '</span>' +
        '<span class="act-sub">Last seen ' + esc(fmtTime(u.lastSeen)) + ' · ' + esc(u.messages) + ' message' + (u.messages === 1 ? '' : 's') + '</span></div></div>';
    }).join('') : '<p class="empty-note">No users yet.</p>';

    var events = data.events || [];
    var incoming = events.filter(function (e) { return e.type === 'incoming'; });
    document.getElementById('incomingList').innerHTML = incoming.length ? incoming.map(function (e) {
      return '<div class="act-row"><span class="act-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>' +
        '<div class="act-body"><b>' + esc(senderLabel(e)) + '</b>' +
        '<span class="act-sub">' + esc(kindLabel(e.kind)) + (e.phone ? ' · ' + esc(e.phone) : '') + '</span>' +
        '<span class="act-text">' + esc(e.preview || '') + '</span></div>' +
        '<span class="act-time">' + esc(fmtTime(e.at)) + '</span></div>';
    }).join('') : '<p class="empty-note">No messages yet.</p>';

    var replies = events.filter(function (e) { return e.type === 'reply'; });
    document.getElementById('repliesList').innerHTML = replies.length ? replies.map(function (e) {
      var to = e.to || e.from || '';
      var toLabel = to.endsWith('@s.whatsapp.net') ? to.split('@')[0] : to;
      return '<div class="act-row"><span class="act-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg></span>' +
        '<div class="act-body"><b>To ' + esc(toLabel) + (e.via ? ' (via phone-number chat)' : '') + '</b>' +
        '<span class="act-text">' + esc(e.preview || '') + '</span></div>' +
        '<span class="act-time">' + esc(fmtTime(e.at)) + '</span>' + deliveryBadge(e.delivery) + '</div>';
    }).join('') : '<p class="empty-note">No replies yet.</p>';

    var timeline = events.filter(function (e) {
      return e.type === 'connect' || e.type === 'disconnect' || e.type === 'badmac' || e.type === 'session-reset';
    });
    document.getElementById('eventsList').innerHTML = timeline.length ? timeline.map(function (e) {
      return '<div class="act-row">' + iconFor(e.type) +
        '<div class="act-body"><b>' + eventText(e) + '</b></div>' +
        '<span class="act-time">' + esc(fmtTime(e.at)) + '</span></div>';
    }).join('') : '<p class="empty-note">No events yet.</p>';
  }

  window.loadActivity = async function () {
    if (!token) { showPrivate(); return; }
    try {
      var res = await fetch('/api/business/' + encodeURIComponent(businessId) + '/activity?t=' + encodeURIComponent(token));
      if (!res.ok) { showPrivate(); return; }
      render(await res.json());
    } catch (e) {
      document.getElementById('linkLine').textContent = 'Could not load live activity — will try again in 10 seconds.';
    }
  };

  loadActivity();
  timer = setInterval(loadActivity, 10000);
})();
</script>
</body>
</html>
