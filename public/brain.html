    <span class="drawer-title">Musa <em>WhatsApp Bot</em></span>
    <button class="drawer-close" id="drawerClose" type="button" aria-label="Close menu">✕</button>
  </div>
  <nav class="drawer-nav">

    <a href="/brain.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Brain</a>
    <a href="/bulk.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>Bulk Messages</a>
    <a href="/media.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Media</a>
    <a href="/leads.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Leads</a>
    <a href="/notify.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Alerts</a>
  </nav>
</aside>

<main>
  <h1 class="page-title">Brain</h1>
  <div class="biz-row">
    <label class="sr-only" for="businessId">Business ID</label>
    <input id="businessId" placeholder="Business ID" autocomplete="off">
    <button class="secondary" onclick="refreshStatus()">Load</button>
  </div>

  <section class="card" style="flex:none">
    <h2 style="margin:0 0 4px">Brain files</h2>
    <div class="file-row">
      <span class="file-row-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
      <div><b>Brain knowledge</b><span id="brainKnowledgeCount">0 files</span></div>
    </div>
    <div class="file-row">
      <span class="file-row-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <div><b>Customer file</b><span id="brainCustomerCount">0 files</span></div>
    </div>
  </section>

  <section class="card chat-card muse-chat">
    <!-- Friendly chat header: avatar + name + online status. -->
    <div class="chat-header">
      <span class="chat-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.1" fill="currentColor" stroke="none"/><path d="M8 15.5c1.2 1 2.6 1.5 4 1.5s2.8-.5 4-1.5"/></svg></span>
      <span class="chat-header-text"><b>Brain</b><span class="chat-online"><i></i>online</span></span>
      <span id="brainAiBadge" class="badge waiting">● Brain ready</span>
    </div>
    <!-- The summary sits INSIDE the scrollable chat list, so as the
         conversation grows it scrolls away and the live chat stays in
         front — exactly like WhatsApp. The input row stays fixed below. -->
    <div id="brainChat" class="chat-list" aria-live="polite">
      <div id="brainSummary" class="summary-card" style="display:none">
        <b>What your brain understands so far</b>
        <div id="brainSummaryText" class="muted"></div>
      </div>
      <div id="brainMessages"><p class="muted empty-note">No conversation yet.</p></div>
    </div>
  </section>

  <!-- REAL delete: wipes the prompt, the memory and the summary from the
       server — not just words. The brain starts blank afterwards. -->
  <div style="display:flex; justify-content:flex-end; margin: 2px 0 10px;">
    <button class="danger small" type="button" onclick="clearBrainData()">Delete all brain data</button>
  </div>

  <!-- Fixed action bar: the message row is always on screen. -->
  <div class="action-bar stack">
    <div id="brainFilePending" class="file-pending" style="display:none">
      <div class="file-pending-preview" id="brainFilePreview"></div>
      <div class="file-pending-body">
        <b id="brainFileName"></b>
        <input id="brainFileCaption" placeholder="Is file ke baare mein batao — kis kaam ke liye hai?" autocomplete="off" enterkeyhint="send">
        <div class="purpose-row">
          <label><input type="radio" name="brainFilePurpose" value="knowledge" checked> Brain knowledge — sirf brain seekhega, customer ko kabhi nahi bhejega</label>
          <label><input type="radio" name="brainFilePurpose" value="customer"> Customer file — zaroorat par customer ko bhejega</label>
        </div>
        <div class="file-pending-actions">
          <button class="chat-send" id="brainFileSend" type="button" onclick="sendBrainMedia()">Send to brain</button>
          <button class="secondary small" type="button" onclick="cancelBrainMedia()">Cancel</button>
        </div>
      </div>
    </div>
    <div class="chat-input-row">
      <label class="icon-btn chat-attach" for="brainFile" title="Upload a photo or video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></label>
      <input type="file" id="brainFile" class="file-input-hidden" accept="image/*,video/*,audio/*">
      <input id="brainInput" placeholder="Message" autocomplete="off" enterkeyhint="send">
      <button class="icon-btn chat-mic" id="brainMic" type="button" title="Speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
      <button class="chat-send" id="brainSend" type="button" onclick="sendBrainMessage()" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
    </div>
    <p class="muted" id="brainMicHint" style="display:none">Listening…</p>
  </div>

  <nav class="bottom-nav" aria-label="Pages">
    <a href="/index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="/connect.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Connect</a>
    <a href="/brain.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Brain</a>
    <button type="button" onclick="toggleDrawer()" aria-label="More pages"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>More</button>
  </nav>
</main>

<div id="toast"></div>
<script src="/app.js?v=20261122"></script>
<script src="/brain.js?v=20261122"></script>
</body>
</html>
