<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Musa WhatsApp Bot Platform — Brain</title>
<link rel="stylesheet" href="/style.css?v=20261126">
</head>
<body class="brain-page">
<!-- Brain top bar — exactly like the reference: back button, character
     avatar, "Brain" + blue verified badge, green dot + "Online", and a
     three-dot menu. NO video-call button — cut completely. -->
<header class="brain-topbar">
  <button class="brain-back" id="brainBack" type="button" aria-label="Back to home" onclick="location.href='/index.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
  <img class="brain-avatar" src="/brain-character.png" alt="Brain">
  <div class="brain-title-wrap">
    <span class="brain-title">Brain <span class="brain-verified" aria-label="Verified"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#2563eb"/><path d="M8 12.5l2.7 2.7L16.5 9" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
    <span class="brain-online"><i></i>Online</span>
  </div>
  <button class="brain-menu-btn" id="brainMenuBtn" type="button" aria-label="Brain options" aria-haspopup="true" aria-expanded="false" onclick="toggleBrainMenu()"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
</header>

<!-- Three-dot menu: Setup from link + Delete all brain data live here. -->
<div class="brain-menu" id="brainMenu" role="menu">
  <button type="button" onclick="openLinkSheet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Setup from link</button>
  <button type="button" class="danger-item" onclick="clearBrainData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete all brain data</button>
</div>

<main class="brain-main">
  <div id="brainChat" class="brain-chat-list" aria-live="polite">
    <!-- Empty state: the big character + "Hello!" bubble + the start
         pill. As messages arrive the character shrinks and moves up
         (the .compact class, with a CSS transition); the top bar
         stays fixed. -->
    <div id="brainHero" class="brain-hero">
      <img src="/brain-character.png" alt="Brain">
      <div class="brain-hello">Hello!</div>
      <div class="brain-start-pill"><b>Start a conversation with Brain</b><span>Share photos, videos or send a voice message...</span></div>
    </div>
    <div id="brainMessages"></div>
  </div>

  <!-- A file is NEVER sent without a message: choosing a file only
       shows this chip + a caption box. Nothing uploads until the
       owner writes the message and taps "Send to brain". -->
  <div id="brainFilePending" class="file-pending" style="display:none">
    <div class="file-pending-preview" id="brainFilePreview"></div>
    <div class="file-pending-body">
      <b id="brainFileName"></b>
      <input id="brainFileCaption" placeholder="Is file ke baare mein batao — kis kaam ke liye hai?" autocomplete="off" enterkeyhint="send">
      <div class="purpose-row">
        <label><input type="radio" name="brainFilePurpose" value="knowledge" checked> Brain knowledge — sirf brain seekhega, customer ko kabhi nahi bhejega</label>
        <label><input type="radio" name="brainFilePurpose" value="customer"> Customer file — zaroorat par customer ko bhejega</label>
      </div>
      <div class="file-pending-actions">
        <button class="chat-send" id="brainFileSend" type="button" onclick="sendBrainMedia()">Send to brain</button>
        <button class="secondary small" type="button" onclick="cancelBrainMedia()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Composer: white pill with + / photo / video / text / mic / send.
       The text input sits between the video button and the mic — the
       reference shows only icons, but Brain Chat must accept text. -->
  <div class="brain-composer">
    <button class="icon-btn" id="brainPlus" type="button" title="Add a photo, video or voice note" aria-label="Add a file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="icon-btn" id="brainImageBtn" type="button" title="Send a photo" aria-label="Send a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
    <button class="icon-btn" id="brainVideoBtn" type="button" title="Send a video" aria-label="Send a video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></button>
    <input type="file" id="brainFile" class="file-input-hidden" accept="image/*,video/*,audio/*">
    <input type="file" id="brainImageFile" class="file-input-hidden" accept="image/*">
    <input type="file" id="brainVideoFile" class="file-input-hidden" accept="video/*">
    <input id="brainInput" placeholder="Message" autocomplete="off" enterkeyhint="send">
    <button class="icon-btn brain-mic" id="brainMic" type="button" title="Speak" aria-label="Speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
    <button class="brain-send" id="brainSend" type="button" onclick="sendBrainMessage()" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
  </div>
  <p class="muted brain-mic-hint" id="brainMicHint" style="display:none">Listening…</p>
</main>

<!-- Setup from link: paste a website / Facebook / Instagram link, the
     board reads it and fills the brain itself. Brain Chat keeps
     working alongside it — both ways, merge never wipe. -->
<div class="brain-sheet-overlay" id="brainSheetOverlay" onclick="closeLinkSheet()"></div>
<div class="brain-sheet" id="brainLinkSheet" role="dialog" aria-label="Setup from link">
  <h2>Setup from link</h2>
  <p>Paste your website, Facebook page or Instagram link — the brain reads it and learns your business from it. Your existing brain data stays untouched.</p>
  <input id="brainLinkUrl" placeholder="https://your-website.com" autocomplete="off" inputmode="url">
  <div class="sheet-actions" style="margin-top:12px">
    <button class="secondary" type="button" onclick="closeLinkSheet()">Cancel</button>
    <button type="button" id="brainLinkGo" onclick="setupBrainFromLink()">Learn from link</button>
  </div>
  <p class="muted" id="brainLinkStatus" style="margin:10px 0 0"></p>
</div>

<div id="toast"></div>
<script src="/app.js?v=20261126"></script>
<script src="/brain.js?v=20261126"></script>
</body>
</html>
